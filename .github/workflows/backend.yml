name: backend

on:
  push:
    branches: [main]
    paths: ['backend/**', 'infra/docker/**', 'docker-compose.yml', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'infra/docker/**', 'docker-compose.yml', '.github/workflows/backend.yml']

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Type-aware lint and typecheck read the built .d.ts of workspace packages.
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Kafka topics match contracts
        run: node ../scripts/check-topics.mjs
      - name: Generated files are up to date (OpenAPI, schema.sql)
        run: |
          npm run openapi -w @bazaar/gateway
          npm run openapi -w @bazaar/catalog
          npm run openapi -w @bazaar/order
          npm run openapi -w @bazaar/notification
          npm run db:schema-sql -w @bazaar/gateway
          npm run db:schema-sql -w @bazaar/order
          git diff --exit-code -- openapi db
      - run: npm audit --omit=dev --audit-level=high

  integration:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start infrastructure
        run: |
          cp .env.example .env
          make keys
          docker compose up -d --wait --wait-timeout 300 mysql mongo redis kafka storage
          docker compose run --rm --no-deps kafka-init
          docker compose run --rm --no-deps storage-init
      - name: Migrate and run integration tests
        working-directory: backend
        run: |
          npm ci && npm run build
          set -a && source ../.env && set +a
          npm run migrate --workspaces --if-present
          ./db/scripts/apply.sh schema
          npm run test:int
      - name: Saga end to end (gateway + catalog + order over Kafka)
        working-directory: backend
        run: |
          set -a && source ../.env && set +a
          ./db/scripts/apply.sh data
          for service in gateway catalog order; do
            (cd services/$service && nohup node --enable-source-maps dist/main.js > /tmp/$service.log 2>&1 &)
          done
          for attempt in $(seq 1 60); do
            curl -sf localhost:4000/health/ready && curl -sf localhost:4010/health/ready && curl -sf localhost:4020/health/ready && break
            sleep 2
          done
          npm run test:e2e -w @bazaar/order
      - name: Service logs on failure
        if: failure()
        run: tail -n 100 /tmp/gateway.log /tmp/catalog.log /tmp/order.log || true
      - name: Infrastructure logs on failure
        if: failure()
        run: docker compose logs --tail 200
