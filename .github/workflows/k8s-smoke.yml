name: k8s-smoke

# The staging release, end to end on a kind cluster in CI (plan §10 "Cluster smoke"):
# cluster + add-ons, images, data stores, db-setup Job, apps, then requests through the ingress.
on:
  push:
    branches: [main]
    paths:
      - 'infra/k8s/**'
      - 'infra/docker/**'
      - 'backend/**'
      - 'frontend-web/**'
      - 'frontend-admin/**'
      - 'Makefile'
      - '.github/workflows/k8s-smoke.yml'
  workflow_dispatch:

concurrency:
  group: k8s-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - name: Cluster and add-ons
        run: |
          cp .env.example .env
          make keys
          make k8s-up-cluster
      - name: Images → cluster registry
        run: make k8s-load TAG=${GITHUB_SHA::7}
      - name: Deploy (data → db-setup → apps)
        run: infra/k8s/deploy.sh ${GITHUB_SHA::7}
      - name: Requests through the ingress
        run: |
          check() { curl -fsS -o /dev/null -w "%{http_code} $1$2\n" --resolve "$1:80:127.0.0.1" "http://$1$2"; }
          check bazaar.localhost /en
          check bazaar.localhost /vi/c/home-kitchen
          check bazaar.localhost /api/v1/categories
          check admin.bazaar.localhost /seller/orders
          check storage.bazaar.localhost /bazaar-images/placeholders/crafts.svg
          check bazaar.localhost '/_next/image?url=http%3A%2F%2Fstorage.bazaar.localhost%2Fbazaar-images%2Fplaceholders%2Fcrafts.svg&w=640&q=75'
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
          kubectl -n bazaar-data get kafka,kafkanodepool,kafkatopic || true
          kubectl -n bazaar-data logs job/db-setup --all-containers --tail=50 || true
          for app in gateway catalog order notification web; do kubectl -n bazaar logs deploy/$app --tail=30 || true; done
          # Annotations are readable without signing in, unlike job logs: surface the essentials there.
          annotate() { printf '::error title=%s::%s\n' "$1" "$(cat | tail -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"; }
          kubectl get pods -A --no-headers 2>&1 | grep -v ' Running \| Completed ' | annotate 'Pods not running'
          kubectl get events -A --field-selector type=Warning --sort-by=.lastTimestamp 2>&1 | tail -15 | annotate 'Warning events'
          kubectl -n bazaar-data get kafka bazaar -o jsonpath='{.status.conditions}' 2>&1 | annotate 'Kafka conditions'
