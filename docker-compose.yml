# Local infrastructure for Bazaar (plan §8). `make up` starts it; `make down` stops it.
# kafka-init and storage-init are one-shot jobs (topics, buckets) run by `make up` after the rest is healthy.
# Every port is bound to 127.0.0.1 only. Values come from .env (see .env.example).
name: bazaar

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      ORDER_DB_USER: ${ORDER_DB_USER}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
    ports: ['127.0.0.1:3307:3306']
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  mongo:
    image: mongo:8.0.32
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports: ['127.0.0.1:27018:27017']
    volumes:
      - mongo-data:/data/db
      - ./infra/docker/mongo/healthcheck.js:/healthcheck.js:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '/healthcheck.js']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  redis:
    image: redis:8.8.3-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    ports: ['127.0.0.1:6380:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "${REDIS_PASSWORD}" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_NUM_PARTITIONS: 3
    ports: ['127.0.0.1:9094:9094']
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null',
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ['/bin/sh', '/create-topics.sh']
    volumes:
      - ./infra/docker/kafka/create-topics.sh:/create-topics.sh:ro
      - ./infra/docker/kafka/topics.txt:/topics.txt:ro
    restart: 'no'

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: bazaar-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ['127.0.0.1:8085:8080']

  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports: ['127.0.0.1:9002:9000', '127.0.0.1:9003:9001']
    volumes: [storage-data:/data]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/health']
      interval: 5s
      timeout: 3s
      retries: 20

  storage-init:
    image: amazon/aws-cli:2.37.12
    depends_on:
      storage: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_BUCKET_IMAGES: ${STORAGE_BUCKET_IMAGES}
      STORAGE_BUCKET_BACKUPS: ${STORAGE_BUCKET_BACKUPS}
    entrypoint: ['/bin/sh', '/create-buckets.sh']
    volumes: ['./infra/docker/storage/create-buckets.sh:/create-buckets.sh:ro']
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports: ['127.0.0.1:1026:1025', '127.0.0.1:8026:8025']

volumes:
  mysql-data:
  mongo-data:
  redis-data:
  kafka-data:
  storage-data:
