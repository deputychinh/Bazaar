# Edge proxy of the compose `full` profile: plays the part of the Kubernetes ingress (plan §9.2),
# so the same images run behind the same routes. Reached at http://*.bazaar.localhost:8000.
# The client address is set here (never appended), so the gateway trusts exactly one hop.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' '';
}

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# Order updates stream over SSE: hand bytes through as they come.
proxy_buffering off;
proxy_read_timeout 1h;
client_max_body_size 10m;

server {
  listen 8000;
  server_name bazaar.localhost;
  location /api/ { proxy_pass http://gateway:4000; }
  location / { proxy_pass http://web:3100; }
}

server {
  listen 8000;
  server_name admin.bazaar.localhost;
  location /api/ { proxy_pass http://gateway:4000; }
  location / { proxy_pass http://admin:8080; }
}

# Product images and presigned uploads. The web container reaches this same name (network alias),
# so the URL the catalog hands out works for browsers and the image optimizer alike.
server {
  listen 8000;
  server_name storage.bazaar.localhost;
  location / { proxy_pass http://storage:9000; }
}
