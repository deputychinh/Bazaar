# Who may talk to whom inside `bazaar` (plan §9.2). Everything not allowed here is refused.
# Only the gateway reaches the services, so their /internal routes are unreachable from anywhere
# else even before the INTERNAL_API_KEY check.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# The ingress controller serves the three public entry points.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: from-ingress
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [gateway, web, admin] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: traefik }
---
# The web server renders pages with data from the gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-web
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: gateway }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: web }
      ports:
        - { port: http }
---
# Services fetch the gateway's JWKS to verify access tokens.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-services
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: gateway }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {
                  key: app.kubernetes.io/name,
                  operator: In,
                  values: [catalog, order, notification],
                }
      ports:
        - { port: http }
---
# catalog, order and notification answer the gateway only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: services-from-gateway
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [catalog, order, notification] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: gateway }
      ports:
        - { port: http }
---
# Prometheus (namespace observability) scrapes /metrics of the services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: services-from-observability
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: service }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
      ports:
        - { port: http }
---
# The notification service triggers on-demand ISR on the web server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-notification
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: web }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: notification }
      ports:
        - { port: http }
