# Emails, in-app notifications, event log (plan §9.2). Image tag is set by the overlay (`images:`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/component: service
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: notification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification
        app.kubernetes.io/component: service
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: notification
          image: bazaar/notification
          ports:
            - { name: http, containerPort: 4030 }
          envFrom:
            - configMapRef: { name: bazaar-config }
          env:
            - name: PORT
              value: '4030'
            - name: NOTIFICATION_DATABASE_URL
              valueFrom: { secretKeyRef: { name: bazaar-secrets, key: NOTIFICATION_DATABASE_URL } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: bazaar-secrets, key: REDIS_URL } }
            - name: REVALIDATE_SECRET
              valueFrom: { secretKeyRef: { name: bazaar-secrets, key: REVALIDATE_SECRET } }
          # Keep serving while the endpoint removal reaches Traefik and kube-proxy; without it a
          # rolling update drops requests that were already routed to this pod.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            # Longer than one dependency check (HEALTH_CHECK_TIMEOUT_MS = 3 s).
            timeoutSeconds: 4
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/component: service
spec:
  selector:
    app.kubernetes.io/name: notification
  ports:
    - { name: http, port: 4030, targetPort: http }
