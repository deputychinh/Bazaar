# Staging cluster on the laptop (plan §0.2, §9.1): 1 control-plane + 2 workers.
# Traefik listens on NodePorts 30080/30443; they are published on the host as 80/443.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bazaar-staging
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
    extraPortMappings:
      - { containerPort: 30080, hostPort: 80, listenAddress: 127.0.0.1, protocol: TCP }
      - { containerPort: 30443, hostPort: 443, listenAddress: 127.0.0.1, protocol: TCP }
  - role: worker
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0
