# Kubernetes Secrets the base manifests expect, assembled from Secrets Manager (credentials,
# generated by DataStack) and SSM (endpoints). Passwords are URL-encoded into connection strings.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazaar-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: secrets-manager }
  target:
    name: bazaar-secrets
    template:
      engineVersion: v2
      data:
        IDENTITY_DATABASE_URL: 'mysql://{{ .identityUser | urlquery }}:{{ .identityPassword | urlquery }}@{{ .identityHost }}:3306/bazaar_identity?sslaccept=strict'
        ORDER_DATABASE_URL: 'mysql://{{ .orderUser | urlquery }}:{{ .orderPassword | urlquery }}@{{ .orderHost }}:3306/bazaar_order?sslaccept=strict'
        CATALOG_DATABASE_URL: 'mongodb+srv://{{ .catalogUser | urlquery }}:{{ .catalogPassword | urlquery }}@{{ .atlasHost }}/bazaar_catalog?retryWrites=true&w=majority'
        NOTIFICATION_DATABASE_URL: 'mongodb+srv://{{ .notificationUser | urlquery }}:{{ .notificationPassword | urlquery }}@{{ .atlasHost }}/bazaar_notification?retryWrites=true&w=majority'
        REDIS_URL: 'rediss://:{{ .cacheToken | urlquery }}@{{ .cacheHost }}:6379'
        INTERNAL_API_KEY: '{{ .internalApiKey }}'
        REVALIDATE_SECRET: '{{ .revalidateSecret }}'
  data:
    - {
        secretKey: identityUser,
        remoteRef: { key: 'bazaar/${ENV}/aurora/identity', property: username },
      }
    - {
        secretKey: identityPassword,
        remoteRef: { key: 'bazaar/${ENV}/aurora/identity', property: password },
      }
    - {
        secretKey: identityHost,
        remoteRef: { key: 'bazaar/${ENV}/aurora/identity', property: host },
      }
    - { secretKey: orderUser, remoteRef: { key: 'bazaar/${ENV}/aurora/order', property: username } }
    - {
        secretKey: orderPassword,
        remoteRef: { key: 'bazaar/${ENV}/aurora/order', property: password },
      }
    - { secretKey: orderHost, remoteRef: { key: 'bazaar/${ENV}/aurora/order', property: host } }
    - {
        secretKey: catalogUser,
        remoteRef: { key: 'bazaar/${ENV}/atlas/catalog', property: username },
      }
    - {
        secretKey: catalogPassword,
        remoteRef: { key: 'bazaar/${ENV}/atlas/catalog', property: password },
      }
    - {
        secretKey: notificationUser,
        remoteRef: { key: 'bazaar/${ENV}/atlas/notification', property: username },
      }
    - {
        secretKey: notificationPassword,
        remoteRef: { key: 'bazaar/${ENV}/atlas/notification', property: password },
      }
    - { secretKey: cacheToken, remoteRef: { key: 'bazaar/${ENV}/cache/auth' } }
    - { secretKey: internalApiKey, remoteRef: { key: 'bazaar/${ENV}/app/internal-api-key' } }
    - { secretKey: revalidateSecret, remoteRef: { key: 'bazaar/${ENV}/app/revalidate-secret' } }
    - secretKey: atlasHost
      sourceRef: { storeRef: { kind: SecretStore, name: parameter-store } }
      remoteRef: { key: '/bazaar/${ENV}/endpoints/atlas-srv-host' }
    - secretKey: cacheHost
      sourceRef: { storeRef: { kind: SecretStore, name: parameter-store } }
      remoteRef: { key: '/bazaar/${ENV}/endpoints/cache-host' }
---
# MSK: TLS + SASL/SCRAM. Added to every service with envFrom (kustomization patches).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazaar-kafka
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: secrets-manager }
  target: { name: bazaar-kafka }
  data:
    - {
        secretKey: KAFKA_SASL_USERNAME,
        remoteRef: { key: 'AmazonMSK_bazaar-${ENV}-apps', property: username },
      }
    - {
        secretKey: KAFKA_SASL_PASSWORD,
        remoteRef: { key: 'AmazonMSK_bazaar-${ENV}-apps', property: password },
      }
    - secretKey: KAFKA_BROKERS
      sourceRef: { storeRef: { kind: SecretStore, name: parameter-store } }
      remoteRef: { key: '/bazaar/${ENV}/endpoints/kafka-bootstrap' }
---
# Access-token signing keys. RSA keys are not generated by CloudFormation: the runbook creates
# both secrets once per environment (docs/aws.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-jwt
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: secrets-manager }
  target: { name: gateway-jwt }
  data:
    - { secretKey: jwt-private.pem, remoteRef: { key: 'bazaar/${ENV}/gateway/jwt-private' } }
    - { secretKey: jwt-public.pem, remoteRef: { key: 'bazaar/${ENV}/gateway/jwt-public' } }
---
# What the migration Job needs to create the per-service MySQL users.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazaar-db-admin
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: secrets-manager }
  target: { name: bazaar-db-admin }
  data:
    - { secretKey: MYSQL_HOST, remoteRef: { key: 'bazaar/${ENV}/aurora/admin', property: host } }
    - {
        secretKey: MYSQL_ADMIN_USER,
        remoteRef: { key: 'bazaar/${ENV}/aurora/admin', property: username },
      }
    - { secretKey: MYSQL_PWD, remoteRef: { key: 'bazaar/${ENV}/aurora/admin', property: password } }
    - {
        secretKey: IDENTITY_PASSWORD,
        remoteRef: { key: 'bazaar/${ENV}/aurora/identity', property: password },
      }
    - {
        secretKey: ORDER_PASSWORD,
        remoteRef: { key: 'bazaar/${ENV}/aurora/order', property: password },
      }
