# Where External Secrets reads from (namespace bazaar). No auth block: the controller's own AWS
# identity (EKS Pod Identity, ClusterStack) is used, limited to bazaar/${ENV}/* secrets and parameters.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: secrets-manager
spec:
  provider:
    aws: { service: SecretsManager, region: '${AWS_REGION}' }
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: parameter-store
spec:
  provider:
    aws: { service: ParameterStore, region: '${AWS_REGION}' }
