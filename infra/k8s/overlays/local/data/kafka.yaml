# Kafka managed by the Strimzi operator (plan §9.2): KRaft, one dual-role node, topics as code
# (kafka-topics.yaml). Local overlay only; on AWS this is Amazon MSK.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  labels: { strimzi.io/cluster: bazaar }
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - { id: 0, type: persistent-claim, size: 5Gi, deleteClaim: false, kraftMetadata: shared }
  resources:
    requests: { cpu: 200m, memory: 1Gi }
    limits: { memory: 1536Mi }
  jvmOptions:
    -Xms: 512m
    -Xmx: 768m
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: bazaar
spec:
  kafka:
    version: 4.2.0
    listeners:
      - { name: plain, port: 9092, type: internal, tls: false }
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: false
      num.partitions: 3
      group.initial.rebalance.delay.ms: 0
  # Consumer lag per group and topic for Prometheus (PodMonitor in observability/config).
  kafkaExporter:
    groupRegex: '.*'
    topicRegex: '.*'
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
  entityOperator:
    topicOperator:
      resources:
        requests: { cpu: 20m, memory: 128Mi }
        limits: { memory: 256Mi }
