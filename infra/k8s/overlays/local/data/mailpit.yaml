# Catches every email sent in the cluster; UI at http://mail.bazaar.localhost.
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector: { app.kubernetes.io/name: mailpit }
  ports:
    - { name: smtp, port: 1025 }
    - { name: http, port: 8025 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mailpit }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mailpit }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31.4
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: http, containerPort: 8025 }
          readinessProbe:
            httpGet: { path: /livez, port: http }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
