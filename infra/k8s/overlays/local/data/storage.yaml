# S3-compatible object storage (RustFS) for product images. Local overlay only (S3 on AWS).
apiVersion: v1
kind: Service
metadata:
  name: storage
spec:
  selector: { app.kubernetes.io/name: storage }
  ports:
    - { name: s3, port: 9000, targetPort: s3 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage
spec:
  serviceName: storage
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: storage }
  template:
    metadata:
      labels: { app.kubernetes.io/name: storage }
    spec:
      containers:
        - name: storage
          image: rustfs/rustfs:1.0.1
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: bazaar-data-secrets, key: STORAGE_ACCESS_KEY } }
            - name: RUSTFS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: bazaar-data-secrets, key: STORAGE_SECRET_KEY } }
          ports:
            - { name: s3, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /health, port: s3 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
---
# Buckets, public-read policy, CORS and placeholders — the same script as docker compose.
apiVersion: batch/v1
kind: Job
metadata:
  name: storage-init
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: storage-init
          image: amazon/aws-cli:2.37.12
          command: [/bin/sh, /scripts/create-buckets.sh]
          env:
            - { name: STORAGE_ENDPOINT, value: 'http://storage:9000' }
            - { name: STORAGE_BUCKET_IMAGES, value: bazaar-images }
            - { name: STORAGE_BUCKET_BACKUPS, value: bazaar-backups }
            - { name: AWS_DEFAULT_REGION, value: us-east-1 }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: bazaar-data-secrets, key: STORAGE_ACCESS_KEY } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: bazaar-data-secrets, key: STORAGE_SECRET_KEY } }
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: placeholders, mountPath: /placeholders, readOnly: true }
      volumes:
        - name: scripts
          configMap: { name: storage-scripts }
        - name: placeholders
          configMap: { name: storage-placeholders }
