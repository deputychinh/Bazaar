# Local staging on kind (plan §0.2): base apps + in-cluster data stores.
# Rendered by deploy.sh through .generated/kustomization.yaml, which pins every image to the
# git sha being released and holds the secrets made from .env (git-ignored).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - data
secretGenerator:
  - name: bazaar-secrets
    namespace: bazaar
    envs: [.generated/secrets.env]
  - name: gateway-jwt
    namespace: bazaar
    files:
      - jwt-private.pem=.generated/jwt-private.pem
      - jwt-public.pem=.generated/jwt-public.pem
