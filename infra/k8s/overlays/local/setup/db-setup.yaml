# Database setup before every rollout (plan §9.2 Jobs): Prisma migrations, MySQL seed, then the
# MongoDB schema and seed. Steps are init containers, so they run in order and stop at the first
# failure. Every step is idempotent. deploy.sh deletes the previous run, applies this, waits.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-setup
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: identity-migrate
          image: bazaar/gateway-migrate
          env:
            - name: IDENTITY_DB_USER
              valueFrom: { secretKeyRef: { name: bazaar-data-secrets, key: IDENTITY_DB_USER } }
            - name: IDENTITY_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: bazaar-data-secrets, key: IDENTITY_DB_PASSWORD } }
            - name: IDENTITY_DATABASE_URL
              value: mysql://$(IDENTITY_DB_USER):$(IDENTITY_DB_PASSWORD)@mysql:3306/bazaar_identity
            - { name: PRISMA_HIDE_UPDATE_MESSAGE, value: '1' }
        - name: order-migrate
          image: bazaar/order-migrate
          env:
            - name: ORDER_DB_USER
              valueFrom: { secretKeyRef: { name: bazaar-data-secrets, key: ORDER_DB_USER } }
            - name: ORDER_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: bazaar-data-secrets, key: ORDER_DB_PASSWORD } }
            - name: ORDER_DATABASE_URL
              value: mysql://$(ORDER_DB_USER):$(ORDER_DB_PASSWORD)@mysql:3306/bazaar_order
            - { name: PRISMA_HIDE_UPDATE_MESSAGE, value: '1' }
        - name: mysql-seed
          image: mysql:8.4.11
          command:
            - sh
            - -c
            - mysql -hmysql -uroot bazaar_identity < /db/identity/data.sql &&
              mysql -hmysql -uroot bazaar_order < /db/order/data.sql
          env:
            - name: MYSQL_PWD
              valueFrom: { secretKeyRef: { name: bazaar-data-secrets, key: MYSQL_ROOT_PASSWORD } }
          volumeMounts:
            - { name: db, mountPath: /db, readOnly: true }
      containers:
        # Same script as the compose `full` profile.
        - name: mongo-schema-and-seed
          image: mongo:8.0.32
          command: [/bin/bash, /db/seed.sh]
          volumeMounts:
            - { name: db, mountPath: /db, readOnly: true }
      volumes:
        - name: db
          configMap:
            name: db-files
            items:
              - { key: seed.sh, path: seed.sh }
              - { key: identity-data.sql, path: identity/data.sql }
              - { key: order-data.sql, path: order/data.sql }
              - { key: catalog-schema.js, path: catalog/schema.js }
              - { key: catalog-data.js, path: catalog/data.js }
              - { key: notification-schema.js, path: notification/schema.js }
              - { key: notification-data.js, path: notification/data.js }
